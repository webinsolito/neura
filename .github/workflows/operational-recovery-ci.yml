name: NEURA Operational Recovery Validation

on:
  push:
    branches:
      - 'candidate/operational-recovery-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Crash and restart recovery tests
        working-directory: v1_bridge
        run: go test ./... -count=1

  recovery-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Crash and restart recovery tests on Windows native
        working-directory: v1_bridge
        shell: pwsh
        run: go test ./... -count=1
