name: NEURA Self Improvement Governance Validation

on:
  push:
    branches:
      - 'candidate/self-improvement-governance-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-improve-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Governed self-improvement tests
        working-directory: v1_bridge
        run: go test ./... -count=1

  self-improve-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Governed self-improvement tests on Windows native
        working-directory: v1_bridge
        shell: pwsh
        run: go test ./... -count=1
