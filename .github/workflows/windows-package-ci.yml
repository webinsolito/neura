name: NEURA Windows Package

on:
  push:
    branches:
      - 'candidate/v1-packaging-*'
      - 'candidate/windows-package-*'
    paths:
      - 'v1_bridge/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/run-windows.ps1'
      - 'scripts/Start-NEURA.ps1'
      - 'scripts/Launch-NEURA.cmd'
      - 'scripts/NEURA-Windows-LEGGIMI.txt'
      - '.github/workflows/windows-package-ci.yml'
  pull_request:
    paths:
      - 'v1_bridge/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/run-windows.ps1'
      - 'scripts/Start-NEURA.ps1'
      - 'scripts/Launch-NEURA.cmd'
      - 'scripts/NEURA-Windows-LEGGIMI.txt'
      - '.github/workflows/windows-package-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v1_bridge/go.mod
          cache-dependency-path: v1_bridge/go.mod

      - name: Build verified Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Verify portable package contents and hash
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'dist\NEURA-Windows'
          $required = @('neura.exe','Launch-NEURA.cmd','Start-NEURA.ps1','LEGGIMI.txt','PACKAGE-MANIFEST.txt')
          foreach($name in $required){
            $path = Join-Path $package $name
            if(-not (Test-Path -LiteralPath $path -PathType Leaf)){ throw "Package file missing: $name" }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $package 'PACKAGE-MANIFEST.txt') -Raw
          $actual = (Get-FileHash -LiteralPath (Join-Path $package 'neura.exe') -Algorithm SHA256).Hash
          if($manifest -notmatch [regex]::Escape("neura.exe.sha256=$actual")){ throw 'Package SHA256 manifest mismatch' }

      - name: Preflight succeeds without Go dependency at runtime
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'dist\NEURA-Windows'
          $workspace = Join-Path $env:RUNNER_TEMP 'neura-package-workspace'
          $data = Join-Path $env:RUNNER_TEMP 'neura-package-data'
          $launcher = Join-Path $package 'Start-NEURA.ps1'
          $out = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $launcher -PreflightOnly -NoBrowser -Workspace $workspace -DataDir $data 2>&1 | Out-String
          $code = $LASTEXITCODE
          if($code -ne 0){ throw "Preflight failed with exit ${code}: $out" }
          if($out -notmatch 'NEURA_PREFLIGHT_OK'){ throw "Preflight success marker missing: $out" }

      - name: Missing executable gives actionable error
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'dist\NEURA-Windows'
          $exe = Join-Path $package 'neura.exe'
          $hidden = Join-Path $package 'neura.exe.ci-hidden'
          Move-Item -LiteralPath $exe -Destination $hidden
          try {
            $launcher = Join-Path $package 'Start-NEURA.ps1'
            $out = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $launcher -PreflightOnly -NoBrowser 2>&1 | Out-String
            $code = $LASTEXITCODE
            if($code -eq 0){ throw 'Broken package unexpectedly passed preflight' }
            if($out -notmatch 'neura\.exe non trovato'){ throw "Actionable missing-exe message absent: $out" }
          } finally {
            Move-Item -LiteralPath $hidden -Destination $exe -Force
          }

      - name: Launcher smoke start health and clean stop
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'dist\NEURA-Windows'
          $workspace = Join-Path $env:RUNNER_TEMP 'neura-smoke-workspace'
          $data = Join-Path $env:RUNNER_TEMP 'neura-smoke-data'
          $launcher = Join-Path $package 'Start-NEURA.ps1'
          $out = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $launcher -SmokeTest -NoBrowser -Listen '127.0.0.1:8765' -Workspace $workspace -DataDir $data 2>&1 | Out-String
          $code = $LASTEXITCODE
          if($code -ne 0){ throw "Launcher smoke failed with exit ${code}: $out" }
          if($out -notmatch 'NEURA_SMOKE_OK'){ throw "Launcher smoke success marker missing: $out" }

      - uses: actions/upload-artifact@v4
        with:
          name: NEURA-Windows-amd64
          path: dist/NEURA-Windows/**
          if-no-files-found: error
