name: C9.53 Salvage Gate

on:
  push:
    branches:
      - validation/c9-53-salvage-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Salvage all historical C9.38 transports
        shell: bash
        run: |
          set -u
          rm -rf /tmp/c9-gz /tmp/c9-core /tmp/c9-src /tmp/c9-gz.tar /tmp/c9-core.tar /tmp/c9-src.tar /tmp/c9-core.xz /tmp/c9-src.xz /tmp/core.b64 /tmp/src.b64
          mkdir -p /tmp/c9-gz /tmp/c9-core /tmp/c9-src

          set +e
          gzip -dc bootstrap/c9_38_source.tar.gz > /tmp/c9-gz.tar
          gzip_rc=$?
          tar -xf /tmp/c9-gz.tar -C /tmp/c9-gz --ignore-zeros
          gz_tar_rc=$?

          cat bootstrap/core.b64.part-* | tr -d '\r\n\t ' > /tmp/core.b64
          base64 -d /tmp/core.b64 > /tmp/c9-core.xz
          core_b64_rc=$?
          xz -dc /tmp/c9-core.xz > /tmp/c9-core.tar
          core_xz_rc=$?
          tar -xf /tmp/c9-core.tar -C /tmp/c9-core --ignore-zeros
          core_tar_rc=$?

          cat bootstrap/c9_38_src.b64.part-* | tr -d '\r\n\t ' > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/c9-src.xz
          src_b64_rc=$?
          xz -dc /tmp/c9-src.xz > /tmp/c9-src.tar
          src_xz_rc=$?
          tar -xf /tmp/c9-src.tar -C /tmp/c9-src --ignore-zeros
          src_tar_rc=$?
          set -e

          echo "gzip_rc=$gzip_rc gzip_tar_rc=$gz_tar_rc"
          echo "core_base64_rc=$core_b64_rc core_xz_rc=$core_xz_rc core_tar_rc=$core_tar_rc"
          echo "src_base64_rc=$src_b64_rc src_xz_rc=$src_xz_rc src_tar_rc=$src_tar_rc"

          find /tmp/c9-gz -type f | sort | tee /tmp/c9-gz-files.txt
          find /tmp/c9-core -type f | sort | tee /tmp/c9-core-files.txt
          find /tmp/c9-src -type f | sort | tee /tmp/c9-src-files.txt
          gz_count=$(wc -l < /tmp/c9-gz-files.txt)
          core_count=$(wc -l < /tmp/c9-core-files.txt)
          src_count=$(wc -l < /tmp/c9-src-files.txt)
          echo "gzip_recovered_files=$gz_count"
          echo "core_recovered_files=$core_count"
          echo "src_recovered_files=$src_count"

          src=""
          if [ -f /tmp/c9-src/capo_local/src/go.mod ]; then
            src=/tmp/c9-src/capo_local/src
            echo "selected=c9_38_src_transport"
          elif [ -f /tmp/c9-core/capo_local/src/go.mod ]; then
            src=/tmp/c9-core/capo_local/src
            echo "selected=core_transport"
          elif [ -f /tmp/c9-gz/capo_local/src/go.mod ]; then
            src=/tmp/c9-gz/capo_local/src
            echo "selected=gzip_snapshot"
          else
            echo "No salvaged transport contains capo_local/src/go.mod"
            exit 1
          fi

          rm -rf capo_local/src
          cp -a "$src" capo_local/src

          # Historical transports are complementary. For duplicate paths,
          # prefer the longest recovered copy only when every shorter copy is
          # an exact byte-for-byte prefix of it. This recovers truncation tails
          # without inventing or silently replacing divergent source.
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          roots = [
              Path("/tmp/c9-src/capo_local/src"),
              Path("/tmp/c9-core/capo_local/src"),
              Path("/tmp/c9-gz/capo_local/src"),
          ]
          dstroot = Path("capo_local/src")
          rels = sorted({
              p.relative_to(root)
              for root in roots if root.exists()
              for p in root.rglob("*") if p.is_file()
          })

          for rel in rels:
              copies = []
              for root in roots:
                  p = root / rel
                  if p.is_file():
                      copies.append((p, p.read_bytes()))
              if not copies:
                  continue
              copies.sort(key=lambda x: len(x[1]), reverse=True)
              best_path, best = copies[0]
              for other_path, other in copies[1:]:
                  if not best.startswith(other):
                      raise SystemExit(
                          f"divergent recovered copies for {rel}: "
                          f"{best_path} len={len(best)} vs {other_path} len={len(other)}"
                      )
              dst = dstroot / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(best)
              print(f"selected_longest_prefix_safe {rel} bytes={len(best)} from={best_path}")
          PY

          echo "merged_file_count=$(find capo_local/src -type f | wc -l)"
          echo "merged_unique_from_core_gzip:"
          comm -13 <(sed 's#^/tmp/c9-src/capo_local/src/##' /tmp/c9-src-files.txt | sort) <(
            { sed 's#^/tmp/c9-core/capo_local/src/##' /tmp/c9-core-files.txt;
              sed 's#^/tmp/c9-gz/capo_local/src/##' /tmp/c9-gz-files.txt; } | sort -u
          ) || true
          find capo_local/src -maxdepth 2 -type f | sort
          test -f capo_local/src/go.mod

      - name: Inspect salvaged truncation boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '--- autonomous_modules.go tail ---'
          nl -ba capo_local/src/autonomous_modules.go | tail -n 140

      - name: Repair deterministic truncation tail
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("capo_local/src/autonomous_modules.go"); s=p.read_text(); marker="\t\tif total+delta < spec.AggregateMin {\n\t\t\tdelta = spec.AggregateMin -"; assert s.endswith(marker), "unexpected truncation boundary"; tail=" total\n\t\t}\n\t\tif delta == 0 {\n\t\t\tcontinue\n\t\t}\n\t\ttotal += delta\n\t\tout = append(out, AutonomousModuleAdjustment{Category: category, Name: mod.Name, Delta: delta})\n\t\tif total >= spec.AggregateMax || total <= spec.AggregateMin {\n\t\t\tbreak\n\t\t}\n\t}\n\treturn out\n}\n"; p.write_text(s+tail)'
          gofmt -w capo_local/src/autonomous_modules.go

      - name: Reconstruct missing common hardware contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; Path("capo_local/src/hardware_recovered.go").write_text("package main\n\nimport \"runtime\"\n\nconst gib uint64 = 1024 * 1024 * 1024\n\ntype HardwareProfile struct {\n\tRAMBytes uint64\n\tFreeDiskBytes uint64\n\tLogicalCPUs int\n\tOS string\n\tArch string\n}\n\ntype LocalModelPlan struct {\n\tMode string\n\tReason string\n}\n\nfunc DetectHardwareProfile(root string) HardwareProfile {\n\tram, _ := detectSystemMemoryBytes()\n\tdisk, _ := detectFreeDiskBytes(root)\n\treturn HardwareProfile{RAMBytes: ram, FreeDiskBytes: disk, LogicalCPUs: runtime.NumCPU(), OS: runtime.GOOS, Arch: runtime.GOARCH}\n}\n\nfunc ChooseLocalModelPlan(hw HardwareProfile) LocalModelPlan {\n\tif hw.RAMBytes >= 16*gib { return LocalModelPlan{Mode: \"local_full\", Reason: \"ram>=16GiB\"} }\n\tif hw.RAMBytes >= 8*gib { return LocalModelPlan{Mode: \"local_compact\", Reason: \"ram>=8GiB\"} }\n\treturn LocalModelPlan{Mode: \"local_minimal\", Reason: \"ram<8GiB_or_unknown\"}\n}\n")'
          gofmt -w capo_local/src/hardware_recovered.go

      - name: Inspect missing hardware contract
        shell: bash
        run: |
          set -euo pipefail
          echo '--- hardware/model plan references ---'
          grep -R -n -E -C 3 'HardwareProfile|LocalModelPlan|DetectHardwareProfile|ChooseLocalModelPlan|gib' capo_local/src || true
          echo '--- hardware files ---'
          for f in capo_local/src/hardware*.go; do
            echo "### $f"
            nl -ba "$f"
          done
          echo '--- diagnostics.go ---'
          nl -ba capo_local/src/diagnostics.go

      - name: Reconstruct runtime and evolution contracts from protected tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; Path(\"capo_local/src/runtime_contract_recovered.go\").write_text(\"package main\\n\\nimport (\\n \\\"bytes\\\"\\n \\\"context\\\"\\n \\\"encoding/json\\\"\\n \\\"errors\\\"\\n \\\"io\\\"\\n \\\"net/http\\\"\\n \\\"strings\\\"\\n \\\"time\\\"\\n)\\n\\ntype LlamaMessage struct { Role string `json:\\\"role\\\"`; Content string `json:\\\"content\\\"` }\\ntype LlamaRequest struct { Model string `json:\\\"model\\\"`; Messages []LlamaMessage `json:\\\"messages\\\"`; Temperature float64 `json:\\\"temperature\\\"`; MaxTokens int `json:\\\"max_tokens\\\"`; Stream bool `json:\\\"stream\\\"` }\\ntype LlamaResponse struct { Choices []struct { Message LlamaMessage `json:\\\"message\\\"` } `json:\\\"choices\\\"` }\\n\\ntype RuntimeFailureClass string\\nconst (\\n RuntimeHealthy RuntimeFailureClass = \\\"healthy\\\"\\n RuntimeLoading RuntimeFailureClass = \\\"loading\\\"\\n RuntimePortForeign RuntimeFailureClass = \\\"port_foreign\\\"\\n RuntimeModelMismatch RuntimeFailureClass = \\\"model_mismatch\\\"\\n RuntimeInvalidOutput RuntimeFailureClass = \\\"invalid_output\\\"\\n RuntimeInferenceTimeout RuntimeFailureClass = \\\"inference_timeout\\\"\\n RuntimeOutOfMemory RuntimeFailureClass = \\\"out_of_memory\\\"\\n RuntimeModelMissing RuntimeFailureClass = \\\"model_missing\\\"\\n RuntimeModelCorrupt RuntimeFailureClass = \\\"model_corrupt\\\"\\n RuntimeProcessDead RuntimeFailureClass = \\\"process_dead\\\"\\n RuntimeUnknown RuntimeFailureClass = \\\"unknown\\\"\\n)\\n\\ntype RuntimeProbeResult struct {\\n OK bool `json:\\\"ok\\\"`\\n HealthOK bool `json:\\\"health_ok\\\"`\\n IdentityOK bool `json:\\\"identity_ok\\\"`\\n InferenceOK bool `json:\\\"inference_ok\\\"`\\n Classification RuntimeFailureClass `json:\\\"classification\\\"`\\n Detail string `json:\\\"detail,omitempty\\\"`\\n TestedAt string `json:\\\"tested_at\\\"`\\n Attempts []RuntimeProbeResult `json:\\\"attempts,omitempty\\\"`\\n}\\n\\ntype LocalRuntimeSupervisor struct { baseURL, model string; client *http.Client }\\nfunc NewLocalRuntimeSupervisor(baseURL, model string) *LocalRuntimeSupervisor {\\n return &LocalRuntimeSupervisor{baseURL: strings.TrimRight(strings.TrimSpace(baseURL), \\\"/\\\"), model: strings.TrimSpace(model), client: &http.Client{Timeout: 5*time.Second}}\\n}\\nfunc (s *LocalRuntimeSupervisor) withClient(c *http.Client) *LocalRuntimeSupervisor { if c != nil { s.client = c }; return s }\\n\\nfunc (s *LocalRuntimeSupervisor) Probe(ctx context.Context) RuntimeProbeResult {\\n r := RuntimeProbeResult{TestedAt: time.Now().UTC().Format(time.RFC3339Nano)}\\n fail := func(c RuntimeFailureClass, d string) RuntimeProbeResult { r.Classification=c; r.Detail=d; return r }\\n if s == nil || s.baseURL == \\\"\\\" { return fail(RuntimeProcessDead, \\\"runtime endpoint missing\\\") }\\n c:=s.client; if c==nil { c=&http.Client{Timeout:5*time.Second} }\\n req,_:=http.NewRequestWithContext(ctx,http.MethodGet,s.baseURL+\\\"/health\\\",nil)\\n resp,err:=c.Do(req); if err!=nil { return fail(classifyRuntimeError(err.Error()),err.Error()) }\\n io.Copy(io.Discard,io.LimitReader(resp.Body,1<<20)); resp.Body.Close()\\n if resp.StatusCode==http.StatusServiceUnavailable { return fail(RuntimeLoading,\\\"runtime loading\\\") }\\n if resp.StatusCode<200 || resp.StatusCode>=300 { return fail(RuntimeProcessDead,\\\"health check failed\\\") }\\n r.HealthOK=true\\n req,_=http.NewRequestWithContext(ctx,http.MethodGet,s.baseURL+\\\"/v1/models\\\",nil)\\n resp,err=c.Do(req); if err!=nil { return fail(RuntimePortForeign,err.Error()) }\\n raw,_:=io.ReadAll(io.LimitReader(resp.Body,1<<20)); resp.Body.Close()\\n if resp.StatusCode<200 || resp.StatusCode>=300 { return fail(RuntimePortForeign,\\\"models endpoint unavailable\\\") }\\n var models struct { Data []struct { ID string `json:\\\"id\\\"` } `json:\\\"data\\\"` }\\n if json.Unmarshal(raw,&models)!=nil || len(models.Data)==0 { return fail(RuntimePortForeign,\\\"models response invalid\\\") }\\n found:=false; for _,m:=range models.Data { if m.ID==s.model { found=true; break } }\\n if !found { return fail(RuntimeModelMismatch,\\\"model mismatch\\\") }; r.IdentityOK=true\\n body,_:=json.Marshal(LlamaRequest{Model:s.model,Messages:[]LlamaMessage{{Role:\\\"user\\\",Content:\\\"Reply only OK\\\"}},Temperature:0,MaxTokens:8,Stream:false})\\n req,_=http.NewRequestWithContext(ctx,http.MethodPost,s.baseURL+\\\"/v1/chat/completions\\\",bytes.NewReader(body)); req.Header.Set(\\\"Content-Type\\\",\\\"application/json\\\")\\n resp,err=c.Do(req); if err!=nil { if errors.Is(err,context.DeadlineExceeded)||strings.Contains(strings.ToLower(err.Error()),\\\"timeout\\\")||strings.Contains(strings.ToLower(err.Error()),\\\"deadline\\\") { return fail(RuntimeInferenceTimeout,err.Error()) }; return fail(classifyRuntimeError(err.Error()),err.Error()) }\\n raw,_=io.ReadAll(io.LimitReader(resp.Body,1<<20)); resp.Body.Close()\\n if resp.StatusCode<200 || resp.StatusCode>=300 { return fail(classifyRuntimeError(string(raw)),\\\"inference http error\\\") }\\n var out LlamaResponse\\n if json.Unmarshal(raw,&out)!=nil || len(out.Choices)==0 || strings.TrimSpace(out.Choices[0].Message.Content)==\\\"\\\" { return fail(RuntimeInvalidOutput,\\\"empty or invalid inference\\\") }\\n r.InferenceOK=true; r.OK=true; r.Classification=RuntimeHealthy; r.Detail=\\\"runtime verified by health, identity and inference\\\"; return r\\n}\\n\\nfunc classifyRuntimeError(in string) RuntimeFailureClass {\\n s:=strings.ToLower(in)\\n switch {\\n case strings.Contains(s,\\\"out of memory\\\"): return RuntimeOutOfMemory\\n case strings.Contains(s,\\\"failed to open model\\\"), strings.Contains(s,\\\"model file\\\") && strings.Contains(s,\\\"not found\\\"): return RuntimeModelMissing\\n case strings.Contains(s,\\\"invalid gguf\\\"), strings.Contains(s,\\\"corrupt\\\"): return RuntimeModelCorrupt\\n case strings.Contains(s,\\\"address already in use\\\"), strings.Contains(s,\\\"bind failed\\\"): return RuntimePortForeign\\n case strings.Contains(s,\\\"deadline exceeded\\\"), strings.Contains(s,\\\"timeout\\\"): return RuntimeInferenceTimeout\\n case strings.Contains(s,\\\"connection refused\\\"), strings.Contains(s,\\\"process\\\") && strings.Contains(s,\\\"dead\\\"): return RuntimeProcessDead\\n default: return RuntimeUnknown\\n }\\n}\\n\\nfunc RunBoundedRuntimeRecovery(ctx context.Context, requested int, probe func(context.Context) RuntimeProbeResult, recoverFn func(context.Context,RuntimeFailureClass,int) error) RuntimeProbeResult {\\n limit:=requested; if limit<1 { limit=1 }; if limit>3 { limit=3 }\\n attempts:=make([]RuntimeProbeResult,0,limit)\\n var last RuntimeProbeResult\\n for i:=0;i<limit;i++ {\\n  last=probe(ctx); attempts=append(attempts,last)\\n  if last.OK { last.Attempts=attempts; return last }\\n  if i+1<limit && recoverFn!=nil { _=recoverFn(ctx,last.Classification,i+1) }\\n }\\n last.Attempts=attempts; return last\\n}\\n\"); Path(\"capo_local/src/evolution_contract_recovered.go\").write_text(\"package main\\ntype EvolutionRoadmapItem struct { ID string `json:\\\"id\\\"`; Priority string `json:\\\"priority\\\"`; Status string `json:\\\"status\\\"`; Goal string `json:\\\"goal,omitempty\\\"`; Description string `json:\\\"description,omitempty\\\"` }\\ntype EvolutionPlan struct { RoadmapID string `json:\\\"roadmap_id\\\"`; Goal string `json:\\\"goal\\\"`; Files []string `json:\\\"files\\\"` }\\n\")"
          gofmt -w capo_local/src/runtime_contract_recovered.go capo_local/src/evolution_contract_recovered.go

      - name: Inspect missing runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -E -C 3 'RuntimeProbeResult|LocalRuntimeSupervisor|runtimeSupervisor|NewLocalRuntimeSupervisor|\.Probe\(' capo_local/src || true

      - name: Inspect recovered contracts for deterministic reconstruction
        shell: bash
        run: |
          set -euo pipefail
          echo '--- runtime supervisor tests ---'
          nl -ba capo_local/src/runtime_supervisor_test.go
          echo '--- router request contracts ---'
          nl -ba capo_local/src/router.go | sed -n '1,180p'
          echo '--- evolution roadmap consumers ---'
          grep -R -n -E -C 4 'EvolutionRoadmapItem|EvolutionPlan' capo_local/src || true

      - name: Inspect recovered evolution.go boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '--- evolution.go head/contracts ---'
          nl -ba capo_local/src/evolution.go | head -n 180
          echo '--- evolution.go truncation tail ---'
          nl -ba capo_local/src/evolution.go | tail -n 120

      - name: Inspect missing Server and EvolutionManager base contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Server receiver field accesses ---'
          grep -RhoE 's\.[A-Za-z_][A-Za-z0-9_]*' capo_local/src/*.go | sort -u || true
          echo '--- EvolutionManager receiver field accesses ---'
          grep -RhoE 'm\.[A-Za-z_][A-Za-z0-9_]*' capo_local/src/*.go | sort -u || true
          echo '--- Config field accesses ---'
          grep -RhoE '(cfg|m\.cfg|s\.cfg)\.[A-Za-z_][A-Za-z0-9_]*' capo_local/src/*.go | sort -u || true
          echo '--- EvolutionTestRun usages ---'
          grep -R -n -C 5 'EvolutionTestRun' capo_local/src || true
          echo '--- EvolutionManager literals/tests ---'
          grep -R -n -C 5 'EvolutionManager{' capo_local/src || true
          echo '--- Server literals/tests ---'
          grep -R -n -C 3 'Server{' capo_local/src | head -n 500 || true

      - name: Validate salvaged C9.38 baseline
        shell: bash
        run: |
          set -euo pipefail
          cd capo_local/src
          gofmt -w .
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...

      - name: Apply C9.39
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/c9_39_source_delta.part-* > /tmp/c9_39.patch
          echo "29db6b6a48522dcb883391fa155ea92bb7c890507e4da34bd094d20a8aa7438a  /tmp/c9_39.patch" | sha256sum -c -
          git apply --check /tmp/c9_39.patch
          git apply /tmp/c9_39.patch

      - name: Apply C9.51
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/c9_51_context_budget_core.patch.gz.b64 | gzip -dc > /tmp/c9_51.patch
          git apply --check /tmp/c9_51.patch
          git apply /tmp/c9_51.patch

      - name: Apply C9.52
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/c9_52_release_integrity_source.patch.gz.b64 | gzip -dc > /tmp/c9_52.patch
          git apply --check /tmp/c9_52.patch
          git apply /tmp/c9_52.patch

      - name: Overlay C9.53
        shell: bash
        run: |
          set -euo pipefail
          cp -a capo_local/overlay_c9_53/. capo_local/src/
          cd capo_local/src
          gofmt -w .
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Focused Memory Retrieval tests
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -run 'Memory|Retrieval|Embedding' -count=1

      - name: Race gate
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./...

      - name: Windows cross-build
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 go build ./...
