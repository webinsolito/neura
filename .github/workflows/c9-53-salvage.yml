name: C9.53 Salvage Gate

on:
  push:
    branches:
      - validation/c9-53-salvage-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Salvage all historical C9.38 transports
        shell: bash
        run: |
          set -u
          rm -rf /tmp/c9-gz /tmp/c9-core /tmp/c9-src /tmp/c9-gz.tar /tmp/c9-core.tar /tmp/c9-src.tar /tmp/c9-core.xz /tmp/c9-src.xz /tmp/core.b64 /tmp/src.b64
          mkdir -p /tmp/c9-gz /tmp/c9-core /tmp/c9-src

          set +e
          gzip -dc bootstrap/c9_38_source.tar.gz > /tmp/c9-gz.tar
          gzip_rc=$?
          tar -xf /tmp/c9-gz.tar -C /tmp/c9-gz --ignore-zeros
          gz_tar_rc=$?

          cat bootstrap/core.b64.part-* | tr -d '\r\n\t ' > /tmp/core.b64
          base64 -d /tmp/core.b64 > /tmp/c9-core.xz
          core_b64_rc=$?
          xz -dc /tmp/c9-core.xz > /tmp/c9-core.tar
          core_xz_rc=$?
          tar -xf /tmp/c9-core.tar -C /tmp/c9-core --ignore-zeros
          core_tar_rc=$?

          cat bootstrap/c9_38_src.b64.part-* | tr -d '\r\n\t ' > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/c9-src.xz
          src_b64_rc=$?
          xz -dc /tmp/c9-src.xz > /tmp/c9-src.tar
          src_xz_rc=$?
          tar -xf /tmp/c9-src.tar -C /tmp/c9-src --ignore-zeros
          src_tar_rc=$?
          set -e

          echo "gzip_rc=$gzip_rc gzip_tar_rc=$gz_tar_rc"
          echo "core_base64_rc=$core_b64_rc core_xz_rc=$core_xz_rc core_tar_rc=$core_tar_rc"
          echo "src_base64_rc=$src_b64_rc src_xz_rc=$src_xz_rc src_tar_rc=$src_tar_rc"

          find /tmp/c9-gz -type f | sort | tee /tmp/c9-gz-files.txt
          find /tmp/c9-core -type f | sort | tee /tmp/c9-core-files.txt
          find /tmp/c9-src -type f | sort | tee /tmp/c9-src-files.txt
          gz_count=$(wc -l < /tmp/c9-gz-files.txt)
          core_count=$(wc -l < /tmp/c9-core-files.txt)
          src_count=$(wc -l < /tmp/c9-src-files.txt)
          echo "gzip_recovered_files=$gz_count"
          echo "core_recovered_files=$core_count"
          echo "src_recovered_files=$src_count"

          src=""
          if [ -f /tmp/c9-src/capo_local/src/go.mod ]; then
            src=/tmp/c9-src/capo_local/src
            echo "selected=c9_38_src_transport"
          elif [ -f /tmp/c9-core/capo_local/src/go.mod ]; then
            src=/tmp/c9-core/capo_local/src
            echo "selected=core_transport"
          elif [ -f /tmp/c9-gz/capo_local/src/go.mod ]; then
            src=/tmp/c9-gz/capo_local/src
            echo "selected=gzip_snapshot"
          else
            echo "No salvaged transport contains capo_local/src/go.mod"
            exit 1
          fi

          rm -rf capo_local/src
          cp -a "$src" capo_local/src
          echo "selected_file_count=$(find capo_local/src -type f | wc -l)"
          find capo_local/src -maxdepth 2 -type f | sort
          test -f capo_local/src/go.mod

      - name: Inspect salvaged truncation boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '--- autonomous_modules.go tail ---'
          nl -ba capo_local/src/autonomous_modules.go | tail -n 140

      - name: Validate salvaged C9.38 baseline
        shell: bash
        run: |
          set -euo pipefail
          cd capo_local/src
          gofmt -w .
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Apply C9.39
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/c9_39_source_delta.part-* > /tmp/c9_39.patch
          echo "29db6b6a48522dcb883391fa155ea92bb7c890507e4da34bd094d20a8aa7438a  /tmp/c9_39.patch" | sha256sum -c -
          git apply --check /tmp/c9_39.patch
          git apply /tmp/c9_39.patch

      - name: Apply C9.51
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/c9_51_context_budget_core.patch.gz.b64 | gzip -dc > /tmp/c9_51.patch
          git apply --check /tmp/c9_51.patch
          git apply /tmp/c9_51.patch

      - name: Apply C9.52
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/c9_52_release_integrity_source.patch.gz.b64 | gzip -dc > /tmp/c9_52.patch
          git apply --check /tmp/c9_52.patch
          git apply /tmp/c9_52.patch

      - name: Overlay C9.53
        shell: bash
        run: |
          set -euo pipefail
          cp -a capo_local/overlay_c9_53/. capo_local/src/
          cd capo_local/src
          gofmt -w .
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Focused Memory Retrieval tests
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -run 'Memory|Retrieval|Embedding' -count=1

      - name: Race gate
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./...

      - name: Windows cross-build
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 go build ./...
