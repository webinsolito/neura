name: NEURA Safe Workspace Tools Validation

on:
  push:
    branches:
      - 'candidate/safe-workspace-tools-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-tools-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Safe workspace mutation tests
        working-directory: v1_bridge
        run: go test ./... -count=1

  safe-tools-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Safe workspace mutation tests on Windows native runner
        working-directory: v1_bridge
        shell: pwsh
        run: go test ./... -count=1
