name: Bootstrap C9.38 source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neura-bootstrap-source
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/autonomy
          fetch-depth: 0

      - name: Restore and verify C9.38 core source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d capo_local/src ]; then
            echo "C9.38 source tree is already expanded."
            exit 0
          fi

          archive="bootstrap/c9_38_source.tar.gz"
          if [ -f "$archive" ]; then
            expected_blob="6a50496d5f814d31a1469eda740b8cf2205a2d8b"
            actual_blob="$(git hash-object "$archive")"
            if [ "$actual_blob" != "$expected_blob" ]; then
              echo "Bundled source archive blob mismatch: $actual_blob"
              exit 1
            fi
            tar -xzf "$archive"
          else
            mapfile -t parts < <(find bootstrap -maxdepth 1 -name 'core.b64.part-*' | sort)
            if [ "${#parts[@]}" -ne 15 ]; then
              echo "No verified source archive and expected 15 bootstrap parts, found ${#parts[@]}."
              exit 1
            fi
            cat "${parts[@]}" > /tmp/core.b64
            base64 -d /tmp/core.b64 > /tmp/c9_38_core.tar.xz
            echo "9cb433eb74d5d44207f9d61cde55d75e7ee2b33bf2f7d6ceb8f59adf77e627ee  /tmp/c9_38_core.tar.xz" | sha256sum -c -
            tar -xJf /tmp/c9_38_core.tar.xz
          fi

          test -d capo_local/src
          test -f capo_local/src/go.mod

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NEURA Bootstrap'
          git config user.email 'neura-bootstrap@users.noreply.github.com'
          git add capo_local/src
          if git diff --cached --quiet; then
            echo 'No bootstrap changes.'
            exit 0
          fi
          git commit -m 'bootstrap: expand verified C9.38 core source tree'
          git push origin HEAD:candidate/autonomy
