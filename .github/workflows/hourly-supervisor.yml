name: NEURA Hourly Supervisor
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neura-hourly-supervisor
  cancel-in-progress: false
jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/autonomy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit previous hour and build rotating Mission Board
        env:
          NEURA_SUPERVISOR_WINDOW_MINUTES: '75'
        run: python automation/hourly_supervisor.py
      - name: Persist supervisor evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NEURA Hourly Supervisor'
          git config user.email 'neura-supervisor@users.noreply.github.com'
          git add automation/MISSION_BOARD.md automation/mission_board.json automation/state/supervisor_state.json
          if git diff --cached --quiet; then
            echo 'No supervisor state change.'
            exit 0
          fi
          git commit -m "supervisor: hourly audit and mission board"
          git push origin HEAD:candidate/autonomy
