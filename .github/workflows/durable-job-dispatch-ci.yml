name: NEURA Durable Job Dispatch Validation

on:
  push:
    branches:
      - 'candidate/durable-job-dispatch-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-job-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Durable dispatch tests
        working-directory: v1_bridge
        run: go test ./... -count=1

  durable-job-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Durable dispatch tests on Windows native runner
        working-directory: v1_bridge
        shell: pwsh
        run: go test ./... -count=1
