name: NEURA C9.52 Recovery + Release Integrity CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-c9-52-recovery-release-integrity-ci
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore verified C9.38 Warden source baseline
        shell: bash
        run: |
          set -euo pipefail
          archive="bootstrap/c9_38_source.tar.gz"
          test -f "$archive"
          echo "d3e07f347c6e4026b8792f1d8a4c121368bb92833125658946812898b576f87c  $archive" | sha256sum -c -
          rm -rf capo_local/src
          tar -xzf "$archive"
          test -f capo_local/src/go.mod

      - name: Apply verified C9.39 integration delta
        shell: bash
        run: |
          set -euo pipefail
          patch=/tmp/c9_39_source_delta.patch
          cat bootstrap/c9_39_source_delta.part-00 bootstrap/c9_39_source_delta.part-01 bootstrap/c9_39_source_delta.part-02 bootstrap/c9_39_source_delta.part-03 bootstrap/c9_39_source_delta.part-04 > "$patch"
          echo "29db6b6a48522dcb883391fa155ea92bb7c890507e4da34bd094d20a8aa7438a  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply "$patch"

      - name: Apply verified C9.51 context-budget delta
        shell: bash
        run: |
          set -euo pipefail
          gz=/tmp/c9_51_context_budget_core.patch.gz
          patch=/tmp/c9_51_context_budget_core.patch
          base64 -d bootstrap/c9_51_context_budget_core.patch.gz.b64 > "$gz"
          echo "d4b8a6f500489601daba0a4b696879a39e74449e0448d8b356e5dd18387285a2  $gz" | sha256sum -c -
          gzip -dc "$gz" > "$patch"
          echo "43cc377e1f4297ddd40d5d3e3badbb7213640c008ce0dcdf30feeb035361b705  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply "$patch"
          test -f capo_local/src/context_budget.go

      - name: Apply verified C9.52 release-integrity delta
        shell: bash
        run: |
          set -euo pipefail
          gz=/tmp/c9_52_release_integrity_source.patch.gz
          patch=/tmp/c9_52_release_integrity_source.patch
          base64 -d bootstrap/c9_52_release_integrity_source.patch.gz.b64 > "$gz"
          echo "08e1e1a4fee85d381d9fd26811e5dc7cf83f36e064c44a40d8cb2dad0d6d8ac0  $gz" | sha256sum -c -
          gzip -dc "$gz" > "$patch"
          echo "d6898f851664d90e02184bf005860b94ce3fb8d4d9d359593def1691c516409d  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply "$patch"
          grep -F '0.40.52-c9.52-recovery-release-integrity' capo_local/src/evolution.go
          grep -F '"schema": 2' RELEASE_IDENTITY.json
          echo "1167515a083854efbbdce9a1e9f22ea0f056bff7820907c22736805851f047ff  bootstrap/c9_51_context_budget_core.patch.gz.b64" | sha256sum -c -

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build External Warden for integration tests
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/neura-warden ./cmd/neura-warden
          test -x /tmp/neura-warden

      - name: Formatting check
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l capo_local/src)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: capo_local/src
        run: go vet ./...

      - name: C9.52 release + context integration gate
        working-directory: capo_local/src
        env:
          NEURA_WARDEN_BIN: /tmp/neura-warden
        run: go test -count=1 -run 'TestReleaseIdentity|TestContextBudget|TestCallLlama|TestEvolutionCycleRetriesBadPatchThenPromotes' .

      - name: C9.39 security and model-fabric regression gate
        working-directory: capo_local/src
        env:
          NEURA_WARDEN_BIN: /tmp/neura-warden
        run: go test -count=1 -run 'TestC939|TestExternalWarden|TestModelFabric' .

      - name: Full source anti-regression gate
        working-directory: capo_local/src
        env:
          NEURA_WARDEN_BIN: /tmp/neura-warden
        run: go test -count=1 -skip 'TestStaticRecoveryBundleMatchesCurrentRelease|TestWindowsBootstrapC927Contract|TestCleanWindowsReadinessHarnessExists' ./...

      - name: Focused race gate
        working-directory: capo_local/src
        env:
          NEURA_WARDEN_BIN: /tmp/neura-warden
        run: |
          go test -race -count=1 -run 'TestReleaseIdentity|TestEvolutionCycleRetriesBadPatchThenPromotes|TestContextBudget|TestCallLlama' .
          go test -race -count=1 ./warden

      - name: Windows amd64 cross-build
        working-directory: capo_local/src
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/NEURA_CAPO_LOCAL_C9_52.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/NEURA_WARDEN_C9_52.exe ./cmd/neura-warden
          test -s /tmp/NEURA_CAPO_LOCAL_C9_52.exe
          test -s /tmp/NEURA_WARDEN_C9_52.exe

      - name: Environment-limited gate status
        run: |
          echo 'Static C9.52 recovery bundle=LOCAL_WORKSPACE_PASS; NOT_REPLICATED_IN_SOURCE_ONLY_CI'
          echo 'Full core race=NOT_VERIFIED_IN_C9_52; focused changed-area race is tested above'
          echo 'TestWindowsBootstrapC927Contract=NOT_VERIFIED_IN_SOURCE_CI'
          echo 'TestCleanWindowsReadinessHarnessExists=NOT_VERIFIED_IN_SOURCE_CI'
          echo 'Windows amd64 cross-build=TESTED_BY_THIS_WORKFLOW'
          echo 'Windows native execution=NOT_TESTED'
          echo 'No environment-limited item is reinterpreted as PASS.'
