name: NEURA Source CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore verified bundled source when tree is not expanded
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d capo_local/src ]; then
            archive="bootstrap/c9_38_source.tar.gz"
            test -f "$archive"
            echo "d3e07f347c6e4026b8792f1d8a4c121368bb92833125658946812898b576f87c  $archive" | sha256sum -c -
            tar -xzf "$archive"
          fi
          test -d capo_local/src
          test -f capo_local/src/go.mod

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false

      - name: Formatting check
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l capo_local/src)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: capo_local/src
        run: go vet ./...

      - name: Source regression gate
        working-directory: capo_local/src
        run: go test -count=1 -skip 'TestStaticRecoveryBundleMatchesCurrentRelease|TestWindowsBootstrapC927Contract|TestCleanWindowsReadinessHarnessExists' ./...

      - name: Environment-limited gate status
        run: |
          echo 'TestStaticRecoveryBundleMatchesCurrentRelease=NOT_VERIFIED_IN_SOURCE_CI'
          echo 'TestWindowsBootstrapC927Contract=NOT_VERIFIED_IN_SOURCE_CI'
          echo 'TestCleanWindowsReadinessHarnessExists=NOT_VERIFIED_IN_SOURCE_CI'
          echo 'These are verified by the full Windows release/runtime gate, not reinterpreted as PASS.'
