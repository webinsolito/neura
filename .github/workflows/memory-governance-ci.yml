name: NEURA Memory Governance Validation

on:
  push:
    branches:
      - 'candidate/memory-governance-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-governance-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Memory governance and regression tests
        working-directory: v1_bridge
        run: go test ./... -count=1

  memory-governance-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Memory governance and regression tests on Windows native runner
        working-directory: v1_bridge
        shell: pwsh
        run: go test ./... -count=1
