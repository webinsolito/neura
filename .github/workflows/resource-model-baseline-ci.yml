name: NEURA Resource Model Baseline Validation

on:
  push:
    branches:
      - 'candidate/resource-model-baseline-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Resource/model regression tests
        working-directory: v1_bridge
        run: go test ./... -count=1
      - name: Collect CI benchmark evidence
        working-directory: v1_bridge
        run: go test -run='^$' -bench='Benchmark(ResourceSnapshot|CoreStatusExecution|C953Retrieve500)$' -benchmem -count=1

  resource-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Resource/model regression tests on Windows native
        working-directory: v1_bridge
        shell: pwsh
        run: go test ./... -count=1
      - name: Collect Windows native benchmark evidence
        working-directory: v1_bridge
        shell: pwsh
        run: go test -run='^$' -bench='Benchmark(ResourceSnapshot|CoreStatusExecution|C953Retrieve500)$' -benchmem -count=1
